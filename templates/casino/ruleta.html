{% extends "base.html" %}
{% load humanize %}
{% block title %}Ruleta | Casinopoipa{% endblock %}

{% block content %}
<div class="game-page">
    <div class="layout-shell">
        <header class="compact-game-header">
            <div class="game-title-side">
                <span class="badge-icon">🎡</span>
                <h2>Roulette Pro</h2>
            </div>
            <div class="compact-header-actions">
                <div class="compact-balance">Gs. {{ player.saldo|intcomma }}</div>
                <button type="button" class="btn-compact-deposit" id="quick-deposit-btn">Depositar</button>
                <a href="{% url 'casino:dashboard' %}" class="btn-compact-back">Volver</a>
            </div>
        </header>
        
        <main class="game-shell glass-panel roulette-shell">
            <section class="roulette-premium-board">
                <div class="roulette-wheel-card">
                
                                    <div class="compact-visual-shell" style="position: relative;">
                    <!-- Esta es la flecha limpia apuntando hacia abajo -->
                    <div style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 20px solid #ffffff; z-index: 9999;"></div>
                    <!-- El lienzo de la ruleta que se había borrado -->
                    <canvas id="roulette-canvas" class="roulette-canvas"></canvas>
                </div>

                <div class="roulette-history" id="roulette-history">
                    <div id="selected-roulette-choice">Ninguna apuesta seleccionada</div>
                    <div id="bet-total" style="margin-top:2px;color:#d9d9d9;font-size:11px;">Apuesta total: Gs. 0</div>
                </div>

                    <div class="compact-controls-footer">
                        <div class="color-btn-row">
                            <button type="button" class="roulette-color-button btn-color-red" data-color="red">Rojo</button>
                            <button type="button" class="roulette-color-button btn-color-green" data-color="green">Verde</button>
                            <button type="button" class="roulette-color-button btn-color-black" data-color="black">Negro</button>
                        </div>

                        <div class="compact-bet-row">
                            <label for="ruleta-apuesta">Apuesta</label>
                            <input id="ruleta-apuesta" type="number" min="2000" value="2000" class="compact-input-field" />
                        </div>
                        
                        <div class="compact-modes-row">
                            <button type="button" id="roulette-double-btn">Duplicar</button>
                            <button type="button" id="roulette-undo-btn">Deshacer</button>
                        </div>
                        
                        <button type="button" id="ruleta-bet-button-bottom" class="btn-action-spin">GIRAR</button>
                    </div>

                </div>
            </section>
        </main>
    </div>
</div>

<style>
    /* ==========================================================================
       RULETA PROPORCIONAL INDESTRUCTIBLE PREMIUM (NUNCA SE CORTA)
       ========================================================================== */
    html, body, .game-page {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100vh !important;
        height: 100dvh !important;
        max-height: 100vh !important;
        max-height: 100dvh !important;
        overflow: hidden !important;
        position: fixed !important;
        inset: 0 !important;
        box-sizing: border-box !important;
        background-color: #0b0b0e;
    }

    .layout-shell, .game-shell {
        width: 100% !important;
        max-width: 410px !important;
        margin: 0 auto !important;
        height: 100% !important;
        display: flex !important;
        flex-direction: column !important;
        overflow: hidden !important;
        background-color: #0b0b0e;
    }

    /* CABECERA ULTRA COMPACTA PROFESSIONAL */
    .compact-game-header {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        padding: 6px 12px !important;
        height: 50px !important;
        background: #111116 !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        box-sizing: border-box !important;
    }
    .compact-game-header .game-title-side { display: flex !important; align-items: center !important; gap: 6px !important; color: #fff !important; }
    .compact-game-header h2 { font-size: 13px !important; font-weight: 700 !important; margin: 0 !important; white-space: nowrap; }
    .compact-game-header .badge-icon { font-size: 16px !important; }

    .compact-header-actions { display: flex !important; align-items: center !important; gap: 6px !important; }
    .compact-balance { background: rgba(22, 163, 74, 0.12) !important; padding: 4px 8px !important; border-radius: 4px; border: 1px solid rgba(22, 163, 74, 0.3); font-size: 11px !important; color: #16a34a !important; font-weight: 700; }
    .btn-compact-deposit { background: #f59e0b !important; color: #000 !important; font-weight: 700 !important; font-size: 11px !important; padding: 5px 10px !important; border-radius: 4px !important; border: none !important; cursor: pointer; text-decoration: none; }
    .btn-compact-back { background: #222227 !important; color: #aaa !important; font-weight: 600 !important; font-size: 11px !important; padding: 5px 10px !important; border-radius: 4px !important; border: 1px solid #333 !important; cursor: pointer; text-decoration: none; }

   /* Contenedor del Círculo Gráfico 100% Centrado y un Chiqui Más Grande */
.compact-visual-shell {
    width: 100% !important;
    max-width: 100% !important;
    height: 45vh !important; /* Subimos de 38vh a 45vh para darle ese chiqui extra de tamaño */
    max-height: 45vh !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    margin: 0 auto !important; 
    padding: 5px !important; /* Achicamos el relleno para que el círculo use los bordes */
    box-sizing: border-box !important;
    overflow: hidden !important;
}

.roulette-canvas { 
    width: auto !important;
    height: 100% !important; 
    max-width: 95vw !important; /* Permitimos que se estire casi hasta tocar el borde del celular */
    max-height: 100% !important;
    object-fit: contain !important; 
    display: block !important;
    margin: 0 auto !important; 
}

/* Reducimos el historial para que no empuje la ruleta de costado */
.roulette-history {
    width: 100% !important;
    text-align: center !important;
    color: #fff !important;
    font-size: 12px !important;
    padding: 2px 0 !important;
    margin: 0 auto !important;
    background: rgba(0, 0, 0, 0.2) !important;
}
    /* PANEL DE BOTONES MAQUINA REAL */
    .compact-controls-footer {
        position: fixed !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        margin: 0 auto !important;
        width: 100% !important;
        max-width: 410px !important;
        background: #0d0d11 !important;
        border-top: 1px solid rgba(255, 255, 255, 0.08) !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 6px !important;
        padding: 10px 12px 14px 12px !important;
        box-sizing: border-box !important;
        z-index: 99999 !important;
    }

    .color-btn-row { display: flex !important; justify-content: center !important; gap: 6px !important; width: 100% !important; }
    .roulette-color-button { flex: 1 !important; padding: 8px 0 !important; border-radius: 4px; font-weight: bold; color: #fff; border: none; font-size: 11px; text-transform: uppercase; cursor: pointer; }
    .btn-color-red { background: #dc2626 !important; }
    .btn-color-green { background: #16a34a !important; }
    .btn-color-black { background: #111827 !important; }

    .compact-bet-row { display: flex !important; flex-direction: row !important; justify-content: space-between !important; align-items: center !important; width: 100% !important; background: rgba(255,255,255,0.02) !important; padding: 4px 10px !important; border-radius: 6px !important; box-sizing: border-box !important; }
    .compact-bet-row label { font-size: 11px !important; color: #888 !important; text-transform: uppercase !important; font-weight: 600; }
    .compact-input-field { width: 80px !important; padding: 4px !important; background: #000 !important; border: 1px solid #333 !important; color: #fff !important; text-align: center !important; border-radius: 4px !important; font-size: 13px !important; font-weight: 700; color: #f59e0b !important; }

    .compact-modes-row { display: flex !important; gap: 6px !important; width: 100% !important; }
    .compact-modes-row button { flex: 1 !important; padding: 6px 0 !important; font-size: 11px !important; font-weight: 700 !important; background: #1c1c24 !important; color: #fff !important; border: 1px solid #333 !important; border-radius: 4px !important; cursor: pointer; }

    /* BOTÓN GIRAR OFICIAL ESTILO 3D */
    .btn-action-spin {
        width: 100% !important; height: 42px !important; line-height: 42px !important;
        background: linear-gradient(180deg, #f59e0b, #d97706) !important; color: #000 !important; font-weight: 900 !important;
        font-size: 15px !important; text-transform: uppercase !important; border-radius: 6px !important;
        border: none !important; cursor: pointer !important; padding: 0 !important; display: block !important;
        text-align: center !important;
    }
</style>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        let seleccionActual = "";
        const labelApuesta = document.getElementById("selected-roulette-choice");
        const labelTotal = document.getElementById("bet-total");
        const inputMonto = document.getElementById("ruleta-apuesta");

        // Captura interactiva de los botones Rojo, Verde y Negro
        const botonesColor = document.querySelectorAll(".roulette-color-button");
        botonesColor.forEach(boton => {
            boton.addEventListener("click", function() {
                botonesColor.forEach(b => b.style.outline = "none");
                this.style.outline = "2px solid #3b82f6";
                
                const color = this.getAttribute("data-color");
                if(color === "red") seleccionActual = "Rojo";
                if(color === "green") seleccionActual = "Verde";
                if(color === "black") seleccionActual = "Negro";
                
                if(labelApuesta) labelApuesta.innerText = "Apuesta: " + seleccionActual;
                actualizarResumen();
            });
        });

        // Actualización dinámica del texto de la apuesta total
        function actualizarResumen() {
            if(labelTotal && inputMonto) {
                labelTotal.innerText = "Apuesta total: Gs. " + parseInt(inputMonto.value).toLocaleString('es');
            }
        }
        if(inputMonto) inputMonto.addEventListener("input", actualizarResumen);

        // Duplicar apuesta
        const btnDuplicar = document.getElementById("roulette-double-btn");
        if(btnDuplicar && inputMonto) {
            btnDuplicar.addEventListener("click", function() {
                inputMonto.value = (parseInt(inputMonto.value) || 2000) * 2;
                actualizarResumen();
            });
        }

        // Deshacer apuesta
        const btnDeshacer = document.getElementById("roulette-undo-btn");
        if(btnDeshacer) {
            btnDeshacer.addEventListener("click", function() {
                botonesColor.forEach(b => b.style.outline = "none");
                seleccionActual = "";
                if(labelApuesta) labelApuesta.innerText = "Ninguna apuesta seleccionada";
            });
        }
    });
</script>
{% endblock %}
